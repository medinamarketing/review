<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Aduan — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0E4257;
    --mint: #3FBF9F;
    --bg: #EEF2F4;
    --card: #FFFFFF;
    --text: #14262F;
    --muted: #647984;
    --line: #E3E9EC;
    --danger: #C5372C;
    --shadow: 0 1px 2px rgba(14,66,87,.04), 0 8px 24px rgba(14,66,87,.07);
    --shadow-btn: 0 4px 14px rgba(14,66,87,.22);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100dvh;
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(1100px 460px at 50% -240px, rgba(63,191,159,.14), transparent 70%);
    background-repeat: no-repeat;
    color: var(--text);
    padding: 30px 18px 56px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.34rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; color: var(--navy); }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px; }

  .card { background: var(--card); border-radius: 18px; padding: 24px 22px; box-shadow: var(--shadow); }

  label { display: block; font-size: 0.86rem; font-weight: 700; margin-bottom: 8px; color: var(--navy); }
  input[type="password"] {
    width: 100%; border: 1px solid var(--line); border-radius: 13px;
    padding: 14px 15px; font-size: 1rem; font-family: inherit;
    margin-bottom: 18px; background: #FBFCFD; color: var(--text);
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  input[type="password"]:focus {
    outline: none; background: #fff; border-color: var(--mint);
    box-shadow: 0 0 0 3px rgba(63,191,159,.16);
  }
  button { font-family: inherit; cursor: pointer; border-radius: 13px; border: none; transition: transform .12s ease, background .15s ease; }
  button:active { transform: scale(.985); }
  .primary-btn {
    display: block; width: 100%;
    background: linear-gradient(135deg, #12566F 0%, var(--navy) 60%, #0A3141 100%);
    color: #fff; padding: 16px; font-size: 1.03rem; font-weight: 700;
    box-shadow: var(--shadow-btn); border-radius: 15px; min-height: 54px;
  }
  .primary-btn[disabled] { background: #9BAAB2; box-shadow: none; cursor: default; }

  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .logout { background: var(--card); border: 1px solid var(--line); color: var(--muted); padding: 10px 15px; font-size: 0.86rem; font-weight: 600; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab {
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    padding: 10px 18px; font-size: 0.92rem; font-weight: 700;
  }
  .tab.on { background: var(--navy); border-color: var(--navy); color: #fff; }

  .aduan-item { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .meta { font-size: 0.78rem; color: var(--muted); font-weight: 500; margin-bottom: 12px; }
  .meta .badge {
    display: inline-block; border-radius: 999px; padding: 3px 10px;
    font-weight: 800; font-size: 0.68rem; margin-left: 8px; letter-spacing: .04em;
  }
  .badge.baru { background: #FDECEA; color: var(--danger); }
  .badge.selesai { background: #E7F7F1; color: #14705A; }
  .body-text { font-size: 1rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .act { background: transparent; border: 1px solid var(--line); padding: 9px 15px; font-size: 0.85rem; font-weight: 700; color: var(--text); }
  .act.ok { color: #14705A; border-color: #BEE9DA; }
  .act.del { color: var(--danger); border-color: #F6CFCA; }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 0.94rem; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); }
  .error {
    color: var(--danger); font-size: 0.89rem; margin-bottom: 16px; display: none; line-height: 1.55;
    background: #FDECEA; border: 1px solid #F6CFCA; border-radius: 12px; padding: 12px 14px;
  }
  .error.show { display: block; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="loginView">
    <h1>Aduan — Admin</h1>
    <p class="sub">Masukkan kod untuk melihat aduan pesakit.</p>
    <div class="card">
      <form id="loginForm">
        <div class="error" id="loginError"></div>
        <label for="kod">Kod masuk</label>
        <input type="password" id="kod" autocomplete="current-password"
          inputmode="text" placeholder="Masukkan kod" required>
        <button type="submit" class="primary-btn" id="loginBtn">Log Masuk</button>
      </form>
    </div>
  </div>

  <!-- LIST -->
  <div id="listView" class="hidden">
    <div class="topbar">
      <div>
        <h1>Aduan Pesakit</h1>
        <p class="sub" id="who" style="margin:0"></p>
      </div>
      <button class="logout" id="logoutBtn">Log Keluar</button>
    </div>

    <div class="tabs">
      <button class="tab on" data-status="baru">Baru</button>
      <button class="tab" data-status="selesai">Selesai</button>
    </div>

    <div class="error" id="listError"></div>
    <div id="items"></div>
  </div>

</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://ibnbeehskwikflxbckqp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_FSnTbifN8kV16JkyNR5vVg_W_Ak0Wix";

  // The staff account. Only the code (its password) is typed in — the email is
  // not a secret, and the database still requires a real login before it will
  // release any complaint.
  const ADMIN_EMAIL = "medina@gmail.com";

  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  const loginView = document.getElementById("loginView");
  const listView = document.getElementById("listView");
  const items = document.getElementById("items");
  const listError = document.getElementById("listError");
  const loginError = document.getElementById("loginError");

  let currentStatus = "baru";

  function fmtStamp(iso) {
    return new Date(iso).toLocaleDateString("ms-MY", { day: "2-digit", month: "short", year: "numeric" });
  }

  function fmtDay(d) {
    return new Date(d + "T00:00:00").toLocaleDateString("ms-MY", { day: "2-digit", month: "short", year: "numeric" });
  }

  async function showList() {
    loginView.classList.add("hidden");
    listView.classList.remove("hidden");
    const { data: { user } } = await db.auth.getUser();
    document.getElementById("who").textContent = user ? user.email : "";
    await load();
  }

  async function load() {
    listError.classList.remove("show");
    items.innerHTML = '<div class="empty">Memuatkan…</div>';

    const { data, error } = await db
      .from("aduan")
      .select("*")
      .eq("status", currentStatus)
      .order("created_at", { ascending: false });

    if (error) {
      items.innerHTML = "";
      listError.textContent = "Gagal memuatkan aduan: " + error.message;
      listError.classList.add("show");
      return;
    }

    if (!data.length) {
      items.innerHTML = '<div class="empty">' +
        (currentStatus === "baru" ? "Tiada aduan baru. ✓" : "Tiada aduan selesai lagi.") +
        "</div>";
      return;
    }

    items.innerHTML = "";
    data.forEach((row) => {
      const el = document.createElement("div");
      el.className = "aduan-item";

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "Dihantar " + fmtStamp(row.created_at) + " · Lawatan " + fmtDay(row.tarikh_lawatan);
      const badge = document.createElement("span");
      badge.className = "badge " + row.status;
      badge.textContent = row.status === "baru" ? "BARU" : "SELESAI";
      meta.appendChild(badge);

      // textContent, never innerHTML — a complaint is untrusted text.
      const body = document.createElement("div");
      body.className = "body-text";
      body.textContent = row.aduan;

      const actions = document.createElement("div");
      actions.className = "actions";

      const toggle = document.createElement("button");
      toggle.className = "act ok";
      toggle.textContent = row.status === "baru" ? "Tandai Selesai" : "Buka Semula";
      toggle.addEventListener("click", () => setStatus(row.id, row.status === "baru" ? "selesai" : "baru"));

      const del = document.createElement("button");
      del.className = "act del";
      del.textContent = "Padam";
      del.addEventListener("click", () => remove(row.id));

      actions.appendChild(toggle);
      actions.appendChild(del);

      el.appendChild(meta);
      el.appendChild(body);
      el.appendChild(actions);
      items.appendChild(el);
    });
  }

  async function setStatus(id, status) {
    const { error } = await db.from("aduan").update({ status }).eq("id", id);
    if (error) {
      listError.textContent = "Gagal mengemas kini: " + error.message;
      listError.classList.add("show");
      return;
    }
    load();
  }

  async function remove(id) {
    if (!confirm("Padam aduan ini terus? Tindakan ini tidak boleh dibatalkan.")) return;
    const { error } = await db.from("aduan").delete().eq("id", id);
    if (error) {
      listError.textContent = "Gagal memadam: " + error.message;
      listError.classList.add("show");
      return;
    }
    load();
  }

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("on"));
      tab.classList.add("on");
      currentStatus = tab.dataset.status;
      load();
    });
  });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    loginError.classList.remove("show");
    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.textContent = "Sedang log masuk…";

    const { error } = await db.auth.signInWithPassword({
      email: ADMIN_EMAIL,
      password: document.getElementById("kod").value
    });

    btn.disabled = false;
    btn.textContent = "Log Masuk";

    if (error) {
      loginError.textContent = "Kod salah. Sila cuba lagi.";
      loginError.classList.add("show");
      return;
    }
    showList();
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await db.auth.signOut();
    location.reload();
  });

  // Resume an existing session so a refresh does not force another login.
  const { data: { session } } = await db.auth.getSession();
  if (session) showList();
</script>
</body>
</html>
